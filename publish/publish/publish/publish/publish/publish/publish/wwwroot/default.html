<!DOCTYPE html>
<html>
    <head>
        <title>My CoffeeShop</title>
        <style>
            body {font-family: Arial, sans-serif; margin: 40px;}
            .box {background: #f4f4f4; padding: 15px; margin-bottom: 20px; border-radius: 5px; width:300px;}
            input {display: block; margin-bottom: 10px; padding: 5px; width: 90%}
        </style>
    </head>
        <body>
            <h1>My Coffee Shop</h1>
            
        <!-- Top Section: Side-by-Side Control Boxes -->
    <div style="display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 30px;">
        
        <!-- Box 1: Add Product & Search Bar -->
        <div class="box" style="flex: 1; min-width: 320px;">
            <h3>Add Product</h3>
            <input type="text" id="name" placeholder="Product Name">
            <input type="number" step="0.1" id="price" placeholder="Price">
            <input type="text" id="category" placeholder="Category">
            
            <div style="display: flex; gap: 10px; align-items: center; margin-top: 5px;">
                <button onclick="addProduct()" style="background-color: #2ecc71;">Save Product</button>
                <input type="text" id="searchInput" placeholder="Search products..." onkeyup="filterProducts()" style="width: auto; margin-bottom: 0; flex: 1;">
            </div>
        </div>

        <!-- Box 2: Place an Order -->
        <div class="box" style="flex: 1; min-width: 320px;">
            <h3>Place an Order</h3>
            <input type="text" id="customerName" placeholder="Customer Name">
            <input type="text" id="itemOrdered" placeholder="Item Ordered">
            <input type="number" id="orderQuantity" placeholder="Quantity">
            
            <div style="display: flex; gap: 10px; align-items: center; margin-top: 5px; height: 38px;">
                <button onclick="placeOrder()" style="background-color: #27ae60;">Submit Order</button>
                <input type="text" id="searchOrderInput" placeholder="Search orders..." onkeyup="filterOrders()" style="width: auto; margin-bottom: 0; flex: 1;">
            </div>
        </div>

    </div>

    <!-- Tables Container: Side-by-Side Layout -->
    <div style="display: flex; gap: 20px; flex-wrap: wrap; margin-top: 30px;">
        <div style="flex: 1; min-width: 450px;">
            <h3>Product List</h3>
            <table border="1" style="width: 100%; border-collapse: collapse; margin-top: 20px;">
                <thead>
                    <tr style="background-color:#f2f2f2;">
                        <th style="padding: 10px; text-align: left;">ID</th>
                        <th style="padding: 10px; text-align: left;">Name</th>
                        <th style="padding: 10px; text-align: left;">Price</th>
                        <th style="padding: 10px; text-align: left;">Category</th>
                        <th style="padding: 10px; text-align: left;">Action</th>
                    </tr>
                </thead>
                <tbody id="product-table-body">
                </tbody>
            </table>
        </div>

        <div style="flex: 1; min-width: 450px;">
            <h3>Order List</h3>
            <table border="1" style="width: 100%; border-collapse: collapse; margin-top: 20px;">
                <thead>
                    <tr style="background-color:#f2f2f2;">
                        <th style="padding: 10px; text-align: left;">ID</th>
                        <th style="padding: 10px; text-align: left;">Customer Name</th>
                        <th style="padding: 10px; text-align: left;">Item Ordered</th>
                        <th style="padding: 10px; text-align: left;">Quantity</th>
                        <th style="padding: 10px; text-align: left;">Action</th>
                    </tr>
                </thead>
                <tbody id="order-table-body">
                </tbody>
            </table>
        </div>
    </div>
            
<script>
    const API_URL = window.origin + '/api/products';
    const ORDER_API_URL = window.origin + '/api/orders';
    let allProducts = [];
    let allOrders = [];
    let editingId = null; 
    let editingOrderId = null; // Track order being edited

    function getProducts(){
        fetch(API_URL)
        .then(response => response.json())
        .then(data => {
            allProducts = data;
            displayProducts(allProducts);
        })
        .catch(error => console.error('Error:', error));
    }

    function displayProducts(products){
        const tableBody = document.getElementById('product-table-body');
        tableBody.innerHTML = '';
        
        products.forEach(product => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td style="padding: 10px;">${product.id}</td>
                <td style="padding: 10px;">${product.name}</td>
                <td style="padding: 10px;">$${product.price}</td>
                <td style="padding: 10px;">${product.category}</td>
                <td style="padding: 10px;">
                    <button onclick="editProduct(${product.id}, '${product.name}', ${product.price}, '${product.category}')" style="background-color: #3498db; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; margin-right: 5px;">Edit</button>
                    <button onclick="deleteProduct(${product.id})" style="background-color: #ff4d4d; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">Delete</button>
                </td>
            `;
            tableBody.appendChild(row);
        });
    }

    function filterProducts() {
        const searchText = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allProducts.filter(p => 
            p.name.toLowerCase().includes(searchText) || 
            p.category.toLowerCase().includes(searchText)
        );
        displayProducts(filtered);
    }

    function addProduct(){
        const newProduct = {
            name: document.getElementById('name').value,
            price: parseFloat(document.getElementById('price').value),
            category: document.getElementById('category').value
        };
        const method = editingId ? 'PUT' : 'POST';
        const url = editingId ? `${API_URL}/${editingId}` : API_URL;
        
        fetch(url, {
            method: method,
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(newProduct)
        })
        .then(response => {
            if (response.ok){
                alert(editingId ? 'Product updated successfully!' : 'Product added successfully!');
                document.getElementById('name').value = '';
                document.getElementById('price').value = '';
                document.getElementById('category').value = '';

                editingId = null;
                getProducts();
            }
            else{
                alert('Failed to save Product.');
            }
        })
        .catch(error => console.error('Error:', error));
    }

    function deleteProduct(id){
        if(!confirm(`Are you sure you want to delete product ID ${id}?`)) return;
        fetch(`${API_URL}/${id}`, {
            method: 'DELETE'
        })
        .then(response => {
            if(response.ok){
                alert('Product deleted successfully');
                getProducts();
            }
            else{
                alert('Failed to delete Product.');
            }
        })
        .catch(error => console.error('Error', error));
    }

    function editProduct(id, name, price, category){
        editingId = id;
        document.getElementById('name').value = name;
        document.getElementById('price').value = price;
        document.getElementById('category').value = category;
    }

    // --- Order Functions ---

    function getOrders() {
        fetch(ORDER_API_URL)
        .then(response => response.json())
        .then(data => {
            allOrders = data;
            displayOrders(allOrders);
        })
        .catch(error => console.error('Error loading orders:', error));
    }

    function displayOrders(orders) {
        const orderTableBody = document.getElementById('order-table-body');
        orderTableBody.innerHTML = '';
        
        orders.forEach(order => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td style="padding: 10px;">${order.id}</td>
                <td style="padding: 10px;">${order.customerName}</td>
                <td style="padding: 10px;">${order.itemOrdered}</td>
                <td style="padding: 10px;">${order.quantity}</td>
                <td style="padding: 10px;">
                    <button onclick="editOrder(${order.id}, '${order.customerName}', '${order.itemOrdered}', ${order.quantity})" style="background-color: #3498db; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; margin-right: 5px;">Edit</button>
                    <button onclick="deleteOrder(${order.id})" style="background-color: #ff4d4d; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">Delete</button>
                </td>
            `;
            orderTableBody.appendChild(row);
        });
    }

    function filterOrders() {
        const searchText = document.getElementById('searchOrderInput').value.toLowerCase();
        const filtered = allOrders.filter(o => 
            o.customerName.toLowerCase().includes(searchText) || 
            o.itemOrdered.toLowerCase().includes(searchText)
        );
        displayOrders(filtered);
    }

    function placeOrder(){
        const newOrder = {
            customerName: document.getElementById('customerName').value,
            itemOrdered: document.getElementById('itemOrdered').value,
            quantity: parseInt(document.getElementById('orderQuantity').value)
        };
        
        const method = editingOrderId ? 'PUT' : 'POST';
        const url = editingOrderId ? `${ORDER_API_URL}/${editingOrderId}` : ORDER_API_URL;

        fetch(url, {
            method: method,
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(newOrder)
        })
        .then(response => {
            if(response.ok){
                alert(editingOrderId ? 'Order updated successfully!' : 'Order placed successfully!');
                document.getElementById('customerName').value = '';
                document.getElementById('itemOrdered').value = '';
                document.getElementById('orderQuantity').value = '';
                
                editingOrderId = null; // Reset edit state
                getOrders(); 
            }
            else{
                alert('Failed to process order.');
            }
        })
        .catch(error => console.error('Error:', error));
    }

    function editOrder(id, customerName, itemOrdered, quantity) {
        editingOrderId = id;
        document.getElementById('customerName').value = customerName;
        document.getElementById('itemOrdered').value = itemOrdered;
        document.getElementById('orderQuantity').value = quantity;
    }

    function deleteOrder(id) {
        if(!confirm(`Are you sure you want to delete order ID ${id}?`)) return;
        fetch(`${ORDER_API_URL}/${id}`, {
            method: 'DELETE'
        })
        .then(response => {
            if(response.ok){
                alert('Order deleted successfully');
                getOrders();
            } else {
                alert('Failed to delete order.');
            }
        })
        .catch(error => console.error('Error:', error));
    }

    // Initial load calls
    getProducts();
    getOrders();
</script>
        </body>
</html>
